{% extends "base.html" %}

{% block title %}Pymap - New Job{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="title">Create Job</h1>

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label class="label">Source Server</label>
                <div class="control">
                    <input class="input" type="text" name="source_host" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Destination Server</label>
                <div class="control">
                    <input class="input" type="text" name="destination_host" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Credentials</label>
                <div class="control">
                    <textarea class="textarea" name="credentials" rows="8" placeholder="user@email.tld password
user1@email.tld password1 user2@email.tld password2" required></textarea>
                </div>
                <p class="help">
                    One credential per line. If only one user/password is provided,
                    it will be used for both source and destination.
                </p>
            </div>

            <div class="field">
                <label class="label">Additional Arguments</label>
                <div class="control">
                    <input class="input" type="text" name="extra_args" placeholder="--ssl1 --ssl2">
                </div>
            </div>

            <div class="field">
                <div class="control">
                    <button class="button is-primary" type="submit">
                        Create Job
                    </button>
                    <a href="{% url 'pymap:job_list' %}" class="button">
                        Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</section>
{% endblock %}
