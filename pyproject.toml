[project]
name = "pymap"
version = "0.5.0"
description = ""
authors = [
    {name = "hallowslab", email = "hallows.tech.lab@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=5.2.7,<6.0.0)",
    "imapsync-scriptgen @ git+https://github.com/hallowslab/imapsync-scriptgen.git@main"
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy] (>=5.2.7,<6.0.0)",
]


[project.entry-points."arka.plugins"]
pymap = "pymap:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
